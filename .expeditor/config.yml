# Documentation available at https://expeditor.chef.io/docs/getting-started/
---
# Slack channel in Chef Software slack to send notifications about build failures, etc
slack:
  notify_channel: chef-notify

# This publish is triggered by the `built_in:publish_rubygems` artifact_action.
rubygems:
  - win32-event

github:
  # This deletes the GitHub PR branch after successfully merged into the release branch
  delete_branch_on_merge: true
  version_tag_format: "win32-event-{{version}}"
  # allow bumping the minor release via label
  minor_bump_labels:
    - "Expeditor: Bump Version Minor"     

release_branches:
  - main:
      version_constraint: "0.*"

changelog:
  rollup_header: Changes not yet released to rubygems.org

# Windows unit tests were previously duplicated here via Buildkite
# (.expeditor/verify.pipeline.yml), running the same windows-2022/
# windows-2025 x Ruby 3.1/3.4 matrix as the GitHub Actions "unit"
# workflow (.github/workflows/unit.yml). That duplication has been
# removed; verify.pipeline.yml is now a minimal no-op kept only because
# Expeditor's Buildkite trigger requires the file to exist and branch
# protection on `main` still requires the
# "buildkite/chef-win32-event-main-verify" status check.
# NOTE: branch protection on `main` should be updated to require
# "allchecks" (.github/workflows/allchecks.yml) instead, after which
# this pipeline and its declaration below can be removed entirely.
pipelines:
  - verify:
      description: Pull Request validation tests
      public: true

subscriptions:
  # These actions are taken, in order they are specified, anytime a Pull Request is merged.
  - workload: pull_request_merged:{{github_repo}}:{{release_branch}}:*
    actions:
      - built_in:bump_version:
          ignore_labels:
            - "Expeditor: Skip Version Bump"
            - "Expeditor: Skip All"
      - bash:.expeditor/update_version.sh:
          only_if: built_in:bump_version
      - built_in:update_changelog:
          ignore_labels:
            - "Expeditor: Skip Changelog"
            - "Expeditor: Skip All"
      - built_in:build_gem:
          only_if: built_in:bump_version

  - workload: project_promoted:{{agent_id}}:*
    actions:
      - built_in:rollover_changelog
      - built_in:publish_rubygems